org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compilation breaks when the project (D:) and the Flutter
# pub cache (C:) live on different drives — its relocatable cache throws
# "this and base files have different roots". Disable it for reliable builds.
kotlin.incremental=false
